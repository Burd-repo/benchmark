name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BURD_CONTROL_TEST_DATABASE_URL: postgres://burd:burd@127.0.0.1:5432/burd_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: burd
          POSTGRES_PASSWORD: burd
          POSTGRES_DB: burd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burd -d burd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify sanitized JSON contract snapshots
        run: cargo test -p burd-bench contract_tests::sanitized_json_contract_snapshots_are_stable -- --exact

      - name: Run test suite
        run: cargo test --workspace

      - name: Verify PostgreSQL migrations and provider persistence
        run: cargo test -p burd-control-plane -- --ignored

      - name: Precompile fast contract tests
        run: cargo test -p burd-bench --lib --no-run

      - name: Enforce fast contract test budget
        shell: pwsh
        run: ./scripts/check-contract-test-time.ps1 -MaxSeconds 15
