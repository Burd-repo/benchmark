name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify sanitized JSON contract snapshots
        run: cargo test -p burd-bench contract_tests::sanitized_json_contract_snapshots_are_stable -- --exact

      - name: Run test suite
        run: cargo test --workspace

      - name: Precompile fast contract tests
        run: cargo test -p burd-bench --lib --no-run

      - name: Enforce fast contract test budget
        shell: pwsh
        run: ./scripts/check-contract-test-time.ps1 -MaxSeconds 15
