[workspace]
members = [
    "crates/burd-agent",
    "crates/burd-api-local",
    "crates/burd-artifact-helper",
    "crates/burd-bench",
    "crates/burd-control-plane",
    "crates/burd-hardware",
    "crates/burd-llmfit",
    "crates/burd-protocol",
]
exclude = ["third_party/llmfit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Burd"]

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
cookie = { version = "0.18", features = ["private"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
cudarc = { version = "0.19.8", default-features = false, features = ["std", "driver", "runtime", "cublas", "dynamic-loading", "cuda-12000"] }
dirs = "6.0"
ed25519-dalek = "2.2"
futures-util = "0.3"
getrandom = "0.2"
llmfit-core = { path = "third_party/llmfit/llmfit-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
openidconnect = { version = "3.5", default-features = false, features = ["reqwest"] }
sha2 = "0.10"
sysinfo = "0.38"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower = "0.5"
ureq = { version = "3.2", features = ["json"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
url = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
