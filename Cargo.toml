[workspace]
members = [
    "crates/burd-agent",
    "crates/burd-api-local",
    "crates/burd-bench",
    "crates/burd-hardware",
    "crates/burd-llmfit",
    "crates/burd-protocol",
]
exclude = ["third_party/llmfit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Burd"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
llmfit-core = { path = "third_party/llmfit/llmfit-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.38"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
ureq = { version = "3.2", features = ["json"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
